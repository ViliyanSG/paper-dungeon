name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export:
    name: Export game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        run: sed -i 's/GAME_VERSION := "dev"/GAME_VERSION := "${{ github.run_number }}"/' main.gd

      - name: Remove Android preset (desktop job only)
        run: sed -i '/^\[preset\.2\]/,$d' export_presets.cfg

      - name: Export (Windows + Linux)
        id: export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          cache: true

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          allowUpdates: true
          tag: v1.0.${{ github.run_number }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Export Android
    needs: export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        run: sed -i 's/GAME_VERSION := "dev"/GAME_VERSION := "${{ github.run_number }}"/' main.gd

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true

      - name: Create debug keystore
        run: keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Unpack the release keystore (only if one is configured)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            echo "RELEASE_KEYSTORE=$(pwd)/release.keystore" >> $GITHUB_ENV
            echo "Release keystore ready — this build will be release-signed."
          else
            echo "No ANDROID_KEYSTORE_B64 secret — falling back to a debug-signed APK."
          fi

      - name: Stamp the Android version code
        run: |
          sed -i 's|^version/code=.*|version/code=${{ github.run_number }}|' export_presets.cfg
          sed -i 's|^version/name=.*|version/name="1.0.${{ github.run_number }}"|' export_presets.cfg
          grep -E '^version/' export_presets.cfg

      - name: Configure Godot Android settings
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}\""
            echo "export/android/debug_keystore = \"$(pwd)/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            if [ -n "$RELEASE_KEYSTORE" ]; then
              echo "export/android/release_keystore = \"$RELEASE_KEYSTORE\""
              echo "export/android/release_keystore_user = \"$KEY_ALIAS\""
              echo "export/android/release_keystore_pass = \"$KEY_PASS\""
            fi
          } > ~/.config/godot/editor_settings-4.tres

      - name: Install Android SDK build tools 34
        run: |
          SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses 2>&1 | tail -2 || true
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -2 || true

      - name: Install Android build template
        run: |
          mkdir -p android/build
          unzip -o ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build > /dev/null
          echo -n "4.3.stable" > android/.build_version
          touch android/.gdignore

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.RELEASE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p build/android
          godot --headless --path . --import || true
          if [ -n "$RELEASE_KEYSTORE" ]; then
            godot --headless --path . --export-release "Android" build/android/EndlessDescent.apk
          else
            godot --headless --path . --export-debug "Android" build/android/EndlessDescent.apk
          fi
          ls -la build/android/EndlessDescent.apk

      - name: Show how the APK was signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          "$APKSIGNER" verify --print-certs build/android/EndlessDescent.apk 2>&1 | head -8 || echo "(apksigner not available)"

      - name: Upload APK to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: v1.0.${{ github.run_number }}
          artifacts: build/android/EndlessDescent.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Export Web
    needs: export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        run: sed -i 's/GAME_VERSION := "dev"/GAME_VERSION := "${{ github.run_number }}"/' main.gd

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable || true

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Web" build/web/index.html \
            || godot --headless --path . --export-debug "Web" build/web/index.html
          ls -la build/web

      - name: Make it installable on iPhone (Apple PWA meta tags)
        run: |
          TAGS='<link rel="apple-touch-icon" href="index.apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Endless Descent"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#211d18">'
          sed -i "s|</head>|${TAGS}</head>|" build/web/index.html
          echo "apple tags injected: $(grep -c 'apple-mobile-web-app-capable' build/web/index.html)"
          echo "manifest present: $(ls build/web | grep -c manifest)"

      - name: Zip web build (index.html at archive root)
        run: |
          cd build/web
          zip -r ../../EndlessDescent-web.zip .
          cd ../..
          ls -la EndlessDescent-web.zip

      - name: Upload web build to release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: v1.0.${{ github.run_number }}
          artifacts: EndlessDescent-web.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the web folder for the Pages job
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 1

  pages:
    name: Publish playable web version
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true      # a Pages hiccup must not fail the whole build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  itch:
    name: Publish to itch.io
    needs: [export, android, web]
    runs-on: ubuntu-latest
    if: ${{ vars.ITCH_TARGET != '' }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v1.0.${{ github.run_number }}" \
            --repo "${{ github.repository }}" -D dist
          ls -la dist

      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors -o butler.zip \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "ITCH_TARGET is set but BUTLER_API_KEY secret is missing — add it in repo settings."
            exit 1
          fi
          VER="1.0.${{ github.run_number }}"
          for f in dist/*; do
            base=$(basename "$f")
            case "$base" in
              *[Ww]eb*)     ch=html5 ;;
              *[Ww]indows*) ch=windows ;;
              *[Ll]inux*)   ch=linux ;;
              *.apk)        ch=android ;;
              *) echo "skip $base"; continue ;;
            esac
            echo "Pushing $base -> $ITCH_TARGET:$ch"
            ./butler push "$f" "$ITCH_TARGET:$ch" --userversion "$VER"
          done
